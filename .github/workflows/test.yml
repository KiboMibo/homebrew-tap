name: Test formulas

on:
  push:
    paths:
      - "Formula/**"
      - "Casks/**"
      - ".github/workflows/test.yml"
  pull_request:
    paths:
      - "Formula/**"
      - "Casks/**"
      - ".github/workflows/test.yml"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # The checkout, not the published tap, so a pull request tests its own
      # formulas and casks.
      - name: Tap repository
        run: |
          git -C "$GITHUB_WORKSPACE" checkout -B ci
          brew tap KiboMibo/tap "$GITHUB_WORKSPACE"

      - name: sshmon
        run: |
          brew install KiboMibo/tap/sshmon
          brew test KiboMibo/tap/sshmon
          # The version the formula pins, not one written here: a pinned
          # string went stale on the first bump.
          version="$(brew info --json=v2 KiboMibo/tap/sshmon | jq -r '.formulae[0].versions.stable')"
          test "$(sshmon --version)" = "sshmon $version"

      - name: shitty and pretty
        run: |
          brew install KiboMibo/tap/shitty
          brew test KiboMibo/tap/shitty
          brew install KiboMibo/tap/pretty
          brew test KiboMibo/tap/pretty

      - name: Shitty.app
        run: |
          brew install --cask KiboMibo/tap/shitty-app
          /Applications/Shitty.app/Contents/MacOS/st -version | grep -q Shitty
          # The cask's postflight is what lets the first launch past
          # Gatekeeper; the flag must be gone.
          ! xattr -p com.apple.quarantine /Applications/Shitty.app 2>/dev/null

      - name: Glide.app
        run: |
          brew install --cask KiboMibo/tap/glide-kibo
          version="$(brew info --json=v2 --cask KiboMibo/tap/glide-kibo | jq -r '.casks[0].version')"
          glide --version | grep -qF "$version"
          ! xattr -p com.apple.quarantine /Applications/Glide.app 2>/dev/null
